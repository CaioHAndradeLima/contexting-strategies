[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contexting-strategies"
version = "0.7.0"
description = "A reproducible context assembly evaluation lab for RAG prompts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []
llm-judge = ["openai>=1.100"]
llm-cursor = ["cursor-sdk>=1.2"]

[project.scripts]
context-lab = "contexting_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
